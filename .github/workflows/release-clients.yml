name: Isolated process ownership audit
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install psutil pytest
      - run: python -m pytest -q -o addopts="" --confcutdir=tests/integration tests/integration/test_nested_ownership.py
        env:
          PYTHONPATH: src
