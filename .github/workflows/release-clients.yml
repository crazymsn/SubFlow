name: Release clients

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - "v*"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install package
        run: python -m pip install -e ".[gui,dev]"
      - name: Tests
        run: python -m pytest tests/unit tests/contract tests/integration/test_pipeline_any_video.py -q --no-cov

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install package
        run: python -m pip install -e ".[gui,packaging]"
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/subflow.spec
      - name: Bundle ffmpeg and strip ICU
        shell: pwsh
        run: |
          $dist = "dist/SubFlow"
          $ffmpeg = (Get-Command ffmpeg).Source
          $probe = (Get-Command ffprobe).Source
          Copy-Item $ffmpeg (Join-Path $dist "ffmpeg.exe") -Force
          Copy-Item $probe (Join-Path $dist "ffprobe.exe") -Force
          $internal = Join-Path $dist "_internal"
          if (Test-Path $internal) {
            Get-ChildItem $internal -File -Filter "icu*.dll" | Remove-Item -Force
          }
          $ver = (Select-String -Path pyproject.toml -Pattern 'version = "([^"]+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path $dist -DestinationPath "SubFlow-Windows-$ver.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SubFlow-Windows
          path: dist/SubFlow
      - uses: actions/upload-artifact@v4
        with:
          name: SubFlow-Windows-zip
          path: SubFlow-Windows-*.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Build .app
        run: bash scripts/build-macos.sh
      - name: Zip .app
        run: |
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          ditto -c -k --keepParent dist/SubFlow.app "SubFlow-macOS-${VER}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SubFlow-macOS
          path: dist/SubFlow.app
      - uses: actions/upload-artifact@v4
        with:
          name: SubFlow-macOS-zip
          path: SubFlow-macOS-*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SubFlow-*-zip
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SubFlow-Windows-*.zip
            SubFlow-macOS-*.zip
          generate_release_notes: true
