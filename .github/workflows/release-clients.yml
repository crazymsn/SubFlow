name: Release clients
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clients:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            backend: cpu
          - os: macos-14
            label: macOS-arm64
            backend: mps
          - os: macos-15-intel
            label: macOS-x64
            backend: cpu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      SUBFLOW_TORCH_BACKEND: ${{ matrix.backend }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install build and test tools
        run: python -m pip install -e '.[gui,dev,packaging]'
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: ruff check src tests scripts
      - name: Prepare recognition runtime from scratch
        run: python scripts/prepare-runtime.py asr
      - name: Prepare dubbing dependencies from scratch
        run: python scripts/prepare-runtime.py gptsovits --skip-models
      - name: Probe Apple GPU dependencies and available hardware
        if: matrix.backend == 'mps'
        run: python scripts/check-apple-gpu.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.backend == 'mps'
        with:
          name: apple-gpu-report
          path: apple-gpu-report.json
          if-no-files-found: ignore
      - name: Build Windows client with automatic installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SourceOnly -SkipInstall
      - name: Build macOS client with automatic installer
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh
      - name: Smoke test Windows launcher
        if: runner.os == 'Windows'
        run: python scripts/smoke-client.py dist/SubFlow/SubFlow.exe
      - name: Smoke test macOS launcher
        if: runner.os == 'macOS'
        run: python scripts/smoke-client.py dist/SubFlow.app/Contents/MacOS/SubFlow
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SubFlow -DestinationPath SubFlow-${{ matrix.label }}.zip
      - name: Archive macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/SubFlow.app SubFlow-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SubFlow-${{ matrix.label }}
          path: SubFlow-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.label }}
          path: client-smoke.json
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: subflow:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose CPU smoke
        run: |
          docker compose config --quiet
          docker compose run --rm subflow --help
          docker compose run --rm --entrypoint python subflow /app/scripts/prepare-runtime.py asr
          docker compose run --rm --entrypoint python subflow /app/scripts/prepare-runtime.py gptsovits --skip-models
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [clients, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SubFlow-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: SubFlow-*.zip
          generate_release_notes: true
