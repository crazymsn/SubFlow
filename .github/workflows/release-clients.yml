name: Release clients
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clients:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            backend: cuda
          - os: macos-14
            label: macOS-arm64
            backend: mps
          - os: macos-15-intel
            label: macOS-x64
            backend: cpu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      QT_QPA_PLATFORM: offscreen
      SUBFLOW_TORCH_BACKEND: ${{ matrix.backend }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      SUBFLOW_BUNDLE_HARDLINK: '1'
      SUBFLOW_RUNTIME_DIR: ${{ runner.temp }}/subflow-runtime
      UV_LINK_MODE: hardlink
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare space for full inference payloads
        run: python .github/scripts/prepare-disk.py
      - name: Verify release version
        shell: bash
        run: |
          python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; ref=os.environ['GITHUB_REF']; assert not ref.startswith('refs/tags/') or ref == 'refs/tags/v'+v, 'Tag and package version differ'"
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 12
        run: ./scripts/install-windows-ffmpeg.ps1
      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full sevenzip
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install build and test tools
        run: python -m pip install -e '.[gui,dev,packaging]'
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: ruff check src tests scripts
      - name: Prepare recognition runtime from scratch
        run: python scripts/prepare-runtime.py asr
      - name: Prepare WhisperX runtime from scratch
        run: python scripts/prepare-runtime.py whisperx
      - name: Prepare dubbing dependencies from scratch
        run: python scripts/prepare-runtime.py gptsovits --skip-models
      - name: Verify audio postprocessing and codecs
        run: python scripts/check-sovits-audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sovits-audio-${{ matrix.label }}
          path: sovits-audio-report.json
          if-no-files-found: ignore
      - name: Probe Apple GPU dependencies and available hardware
        if: matrix.backend == 'mps'
        run: python scripts/check-apple-gpu.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.backend == 'mps'
        with:
          name: apple-gpu-report
          path: apple-gpu-report.json
          if-no-files-found: ignore
      - name: Build Windows client with all offline voice engines
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipInstall -HardlinkModels
      - name: Build macOS client with all offline voice engines
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh
      - name: Smoke test Windows launcher
        if: runner.os == 'Windows'
        run: python scripts/smoke-client.py dist/SubFlow/SubFlow.exe
      - name: Smoke test macOS launcher
        if: runner.os == 'macOS'
        run: python scripts/smoke-client.py dist/SubFlow.app/Contents/MacOS/SubFlow
      - name: Verify all bundled voices on Windows without downloads
        if: runner.os == 'Windows'
        run: python scripts/check-offline-voices.py dist/SubFlow/offline --backend cpu --output offline-qa
      - name: Verify all bundled voices on macOS without downloads
        if: runner.os == 'macOS'
        run: python scripts/check-offline-voices.py dist/SubFlow.app/Contents/Resources/offline --backend cpu --output offline-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-qa-${{ matrix.label }}
          path: |
            offline-qa/report.json
            offline-qa/*.log
          if-no-files-found: ignore
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          7z a -t7z -mx=1 -ms=off -mmt=2 -v1900m SubFlow-${{ matrix.label }}.7z ./dist/SubFlow
          if ($LASTEXITCODE -ne 0) { throw "Archive failed" }
          7z t SubFlow-${{ matrix.label }}.7z.001
          if ($LASTEXITCODE -ne 0) { throw "Archive verification failed" }
      - name: Archive macOS
        if: runner.os == 'macOS'
        run: |
          7zz a -t7z -mx=1 -ms=off -mmt=2 -v1900m SubFlow-${{ matrix.label }}.7z ./dist/SubFlow.app
          7zz t SubFlow-${{ matrix.label }}.7z.001
      - uses: actions/upload-artifact@v4
        with:
          name: SubFlow-${{ matrix.label }}
          path: SubFlow-${{ matrix.label }}.7z.*
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.label }}
          path: client-smoke.json
          if-no-files-found: ignore
  linux-process-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install psutil pytest
      - name: Verify nested task cleanup and independent pause
        env:
          PYTHONPATH: src
        run: python -m pytest -q -o addopts="" --confcutdir=tests/integration tests/integration/test_nested_ownership.py
      - name: Verify symbolic link rollback
        env:
          PYTHONPATH: src
        run: python -m pytest -q -o addopts="" --confcutdir=tests/integration tests/integration/test_link_rollback.py
      - name: Verify hardlink rollback and shared permissions
        env:
          PYTHONPATH: src
        run: python -m pytest -q -o addopts="" --confcutdir=tests/integration tests/integration/test_hardlink_rollback.py
      - name: Verify interrupted output commits
        env:
          PYTHONPATH: src
        run: python -m pytest -q -o addopts="" --confcutdir=tests/integration tests/integration/test_commit_interruptions.py
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare space for image layers
        run: python3 .github/scripts/prepare-disk.py
      - name: Read image version
        id: version
        run: python3 -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; open(os.environ['GITHUB_OUTPUT'],'a').write('value='+v+'\n')"
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: subflow:local
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=subflow-${{ matrix.arch }}
          cache-to: type=gha,scope=subflow-${{ matrix.arch }},mode=max
      - name: Compose CPU smoke
        run: |
          printf 'services:\n  subflow:\n    image: subflow:local\n    pull_policy: never\n' > compose.ci.yaml
          export COMPOSE_FILE=docker-compose.yml:compose.ci.yaml
          docker compose config --quiet
          docker compose run --rm subflow --help
          printf 'host-owned input' > data/.compose-write-check
          docker compose run --rm --entrypoint python subflow -c "from pathlib import Path; p=Path('/data/.compose-write-check'); assert p.read_text() == 'host-owned input'; p.write_text('container write'); p.unlink()"
          docker compose run --rm --entrypoint python subflow /app/scripts/prepare-runtime.py asr
          docker compose run --rm --entrypoint python subflow /app/scripts/prepare-runtime.py whisperx
          docker compose run --rm --entrypoint python subflow /app/scripts/prepare-runtime.py qwentts
          docker compose run --rm --entrypoint python subflow /app/scripts/prepare-runtime.py gptsovits --skip-models
          docker compose run --rm --entrypoint python subflow /app/scripts/check-sovits-audio.py
      - name: Log in to Docker Hub
        if: github.repository == 'crazymsn/SubFlow'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested architecture image
        if: github.repository == 'crazymsn/SubFlow'
        run: |
          docker tag subflow:local crazymsn/subflow:sha-${{ github.sha }}-${{ matrix.arch }}
          docker push crazymsn/subflow:sha-${{ github.sha }}-${{ matrix.arch }}
  docker-publish:
    if: github.repository == 'crazymsn/SubFlow'
    needs: [docker, linux-process-lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified multi-platform tags
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          docker buildx imagetools create \
            --tag crazymsn/subflow:"$VERSION" \
            --tag crazymsn/subflow:latest \
            --tag crazymsn/subflow:sha-${{ github.sha }} \
            crazymsn/subflow:sha-${{ github.sha }}-amd64 \
            crazymsn/subflow:sha-${{ github.sha }}-arm64
          docker buildx imagetools inspect crazymsn/subflow:"$VERSION"
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [clients, linux-process-lifecycle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SubFlow-*
          merge-multiple: true
      - name: Calculate download checksums
        run: sha256sum SubFlow-*.7z.* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: SubFlow 语幕 ${{ github.ref_name }}
          files: |
            SubFlow-*.7z.*
            SHA256SUMS
          body_path: docs/release-1.3.60.md
          fail_on_unmatched_files: true
