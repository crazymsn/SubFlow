[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subflow"
version = "1.2.0"
description = "SubFlow 语幕 — 新一代 AI 视频语音识别、自动翻译、字幕生成工具（深度云创科技）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "深度云创科技" }]
keywords = ["subtitles", "whisper", "bilingual", "ffmpeg", "video"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2",
  "pydantic-settings>=2",
  "httpx>=0.27",
  "openai>=1.0",
  "pyyaml>=6",
  "rich>=13",
  "keyring>=25",
  "yt-dlp>=2024.8",
  "json-repair>=0.25",
]

[project.optional-dependencies]
cuda = ["openai-whisper", "torch"]
gui = ["pyside6>=6.6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
packaging = ["pyinstaller>=6.10", "curl_cffi>=0.7"]
opencc = ["opencc-python-reimplemented"]
nlp = ["spacy"]

[project.scripts]
subflow = "bilingual_sub.cli.main:app"
subflow-gui = "bilingual_sub.gui.app:main"
bilingual-sub = "bilingual_sub.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bilingual_sub"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "bilingual_sub/_data/config"
"fonts" = "bilingual_sub/_data/fonts"
"assets/brand" = "bilingual_sub/_data/brand"
"src/bilingual_sub/i18n/locales" = "bilingual_sub/i18n/locales"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=bilingual_sub.core --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
packages = ["bilingual_sub"]
